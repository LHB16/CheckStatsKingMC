<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #111214;
      color: #dbdee1;
      padding: 16px;
      display: inline-block;
    }

    .table-container {
      background-color: #1e1f22;
      border: 1px solid #2b2d31;
      border-radius: 14px;
      padding: 20px 24px;
      min-width: 540px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
    }

    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
      padding-bottom: 14px;
      border-bottom: 2px solid #35363c;
    }

    .title-box {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .title {
      font-size: 17px;
      font-weight: 800;
      color: #f59e0b;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .subtitle {
      font-size: 11px;
      color: #949ba4;
      font-weight: 600;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
    }

    th {
      text-align: left;
      padding: 10px 14px;
      font-size: 12px;
      color: #949ba4;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 2px solid #35363c;
    }

    td {
      padding: 10px 14px;
      font-size: 14px;
      border-bottom: 1px solid #2b2d31;
      vertical-align: middle;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:nth-child(even) {
      background-color: rgba(255, 255, 255, 0.02);
    }

    .stt {
      font-weight: 800;
      color: #f59e0b;
      width: 50px;
    }

    .icon-td {
      width: 56px;
      text-align: center;
    }

    /* Khung ô Slot Inventory mặc định của Minecraft */
    .mc-slot {
      width: 42px;
      height: 42px;
      background-color: #8b8b8b;
      border-top: 2.5px solid #373737;
      border-left: 2.5px solid #373737;
      border-right: 2.5px solid #ffffff;
      border-bottom: 2.5px solid #ffffff;
      box-shadow: inset 2px 2px 0px #222222, inset -2px -2px 0px #a0a0a0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      border-radius: 2px;
      box-sizing: border-box;
      position: relative;
    }

    .item-icon {
      width: 32px;
      height: 32px;
      object-fit: contain;
      image-rendering: pixelated;
      filter: drop-shadow(1px 2px 3px rgba(0, 0, 0, 0.5));
    }

    .slot-count {
      position: absolute;
      right: 2px;
      bottom: 1px;
      font-size: 13px;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 1.5px 1.5px 0px #3f3f3f;
      font-family: monospace, sans-serif;
      line-height: 1;
      pointer-events: none;
    }

    .item-name {
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.3px;
      text-shadow: 1.5px 1.5px 0px #000000;
      line-height: 1.3;
    }

    .sub-info {
      font-size: 11px;
      color: #949ba4;
      font-weight: 600;
      margin-top: 3px;
      text-shadow: none;
      letter-spacing: 0;
    }

    .highlight-user {
      color: #f59e0b;
      font-weight: 700;
    }

    .price {
      font-weight: 700;
      color: #10b981;
      text-align: right;
    }

    th.th-price {
      text-align: right;
    }

    .footer {
      margin-top: 16px;
      padding-top: 10px;
      border-top: 1px solid #2b2d31;
      font-size: 11px;
      color: #949ba4;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>
  <div class="table-container">
    <div class="header">
      <div class="title-box">
        <div class="title">{{TITLE}}</div>
        <div class="subtitle">KingMC.vn • Tra cứu giá vật phẩm</div>
      </div>
    </div>
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Icon</th>
          <th>Vật phẩm</th>
          <th class="th-price">Giá</th>
        </tr>
      </thead>
      <tbody>
        {{ROWS}}
      </tbody>
    </table>
  </div>
</body>
</html>
