<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #111214;
      color: #dbdee1;
      padding: 16px;
      display: inline-block;
    }

    .table-container {
      background-color: #1e1f22;
      border: 1px solid #2b2d31;
      border-radius: 14px;
      padding: 20px 24px;
      min-width: 520px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
    }

    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
      padding-bottom: 14px;
      border-bottom: 2px solid #35363c;
    }

    .header-icon-wrapper {
      width: 44px;
      height: 44px;
      background: radial-gradient(circle, #313338 0%, #111214 100%);
      border: 1.5px solid #f59e0b;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.2);
    }

    .header-icon {
      width: 34px;
      height: 34px;
      object-fit: contain;
      image-rendering: pixelated;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.5));
    }

    .title-box {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .title {
      font-size: 17px;
      font-weight: 800;
      color: #f59e0b;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .subtitle {
      font-size: 11px;
      color: #949ba4;
      font-weight: 600;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
    }

    th {
      text-align: left;
      padding: 10px 14px;
      font-size: 12px;
      color: #949ba4;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 2px solid #35363c;
    }

    td {
      padding: 12px 14px;
      font-size: 14px;
      border-bottom: 1px solid #2b2d31;
      vertical-align: middle;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:nth-child(even) {
      background-color: rgba(255, 255, 255, 0.02);
    }

    .stt {
      font-weight: 800;
      color: #f59e0b;
      width: 50px;
    }

    .icon-td {
      width: 52px;
      text-align: center;
    }

    .item-icon {
      width: 32px;
      height: 32px;
      object-fit: contain;
      image-rendering: pixelated;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.4));
    }

    .item-name {
      font-weight: 700;
      color: #ffffff;
    }

    .price {
      font-weight: 700;
      color: #10b981;
      text-align: right;
    }

    th.th-price {
      text-align: right;
    }

    .footer {
      margin-top: 16px;
      padding-top: 10px;
      border-top: 1px solid #2b2d31;
      font-size: 11px;
      color: #949ba4;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer-badge {
      background-color: rgba(245, 158, 11, 0.1);
      color: #f59e0b;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 10px;
    }
  </style>
</head>
<body>
  <div class="table-container">
    <div class="header">
      <div class="title-box">
        <div class="title">{{TITLE}}</div>
        <div class="subtitle">KingMC.vn • Tra cứu giá vật phẩm</div>
      </div>
    </div>
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Icon</th>
          <th>Vật phẩm</th>
          <th class="th-price">Giá</th>
        </tr>
      </thead>
      <tbody>
        {{ROWS}}
      </tbody>
    </table>
  </div>
</body>
</html>
