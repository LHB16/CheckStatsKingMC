<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0f1012;
      color: #dbdee1;
      padding: 16px;
      display: inline-block;
    }

    .chart-container {
      background-color: #1a1b1e;
      border: 1px solid #28292d;
      border-radius: 12px;
      padding: 20px 24px;
      width: 720px;
    }

    /* HEADER */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .player-profile {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar-wrapper {
      width: 42px;
      height: 42px;
      background: #111214;
      border: 1px solid #2e3035;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .avatar-wrapper img {
      width: 36px;
      height: 36px;
      image-rendering: pixelated;
    }

    .player-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .player-name {
      font-size: 17px;
      font-weight: 700;
      color: #f3f4f6;
    }

    .server-label {
      font-size: 12px;
      color: #8a909a;
    }

    .balance-summary {
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
    }

    .balance-val {
      font-size: 22px;
      font-weight: 800;
      color: #10b981;
      line-height: 1.2;
    }

    .balance-change {
      font-size: 12px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 6px;
      display: inline-block;
    }

    .balance-change.positive {
      color: #10b981;
      background: rgba(16, 185, 129, 0.12);
    }

    .balance-change.negative {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.12);
    }

    /* INLINE STATS BAR (TỐI GIẢN) */
    .stats-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #141517;
      border: 1px solid #242529;
      border-radius: 8px;
      padding: 8px 16px;
      margin-bottom: 14px;
      font-size: 12px;
      color: #8a909a;
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stat-item strong {
      color: #d1d5db;
      font-weight: 600;
    }

    .stat-sep {
      color: #383a40;
    }

    /* CHART AREA */
    .chart-area {
      background-color: #141517;
      border: 1px solid #242529;
      border-radius: 8px;
      padding: 12px 12px 8px 12px;
    }

    svg.chart-svg {
      width: 100%;
      height: 220px;
      overflow: visible;
    }

    .grid-line {
      stroke: #222428;
      stroke-width: 1;
      stroke-dasharray: 4, 4;
    }

    .axis-text {
      font-size: 11px;
      fill: #6b7280;
      font-weight: 500;
    }

    .line-path {
      fill: none;
      stroke: #10b981;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .area-path {
      fill: url(#chartGradient);
    }

    .data-point {
      fill: #10b981;
      stroke: #141517;
      stroke-width: 2;
    }

    .data-point.peak {
      fill: #f59e0b;
      stroke: #141517;
      stroke-width: 2;
    }

    .data-point.valley {
      fill: #ef4444;
      stroke: #141517;
      stroke-width: 2;
    }

    .point-label {
      font-size: 10px;
      font-weight: 600;
      fill: #9ca3af;
      text-anchor: middle;
    }

    /* SINGLE POINT NOTICE */
    .single-point-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 180px;
      gap: 10px;
      text-align: center;
    }

    .single-point-icon {
      font-size: 32px;
    }

    .single-point-text {
      font-size: 13px;
      color: #8a909a;
      max-width: 440px;
      line-height: 1.5;
    }

    .single-point-text strong {
      color: #10b981;
    }

    /* FOOTER */
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #242529;
      font-size: 11px;
      color: #6b7280;
    }

    .footer-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .footer-right {
      font-weight: 600;
      color: #8a909a;
    }
  </style>
</head>
<body>

  <div class="chart-container">
    <!-- HEADER -->
    <div class="header">
      <div class="player-profile">
        <div class="avatar-wrapper">
          <img src="{{AVATAR_URL}}" alt="{{PLAYER_NAME}}" onerror="this.src='https://mc-heads.net/avatar/MHF_Steve/44';">
        </div>
        <div class="player-meta">
          <div class="player-name">{{PLAYER_NAME}}</div>
          <div class="server-label">KingMC.vn • Lịch sử biến động 3 ngày</div>
        </div>
      </div>

      <div class="balance-summary">
        <div class="balance-val">{{CURRENT_BALANCE}}</div>
        <div class="balance-change {{CHANGE_CLASS}}">{{CHANGE_VALUE}} ({{CHANGE_PERCENT}})</div>
      </div>
    </div>

    <!-- STATS BAR (TỐI GIẢN) -->
    <div class="stats-bar">
      <div class="stat-item">
        <span>Đỉnh:</span> <strong>{{MAX_BALANCE}}</strong>
      </div>
      <span class="stat-sep">•</span>
      <div class="stat-item">
        <span>Đáy:</span> <strong>{{MIN_BALANCE}}</strong>
      </div>
      <span class="stat-sep">•</span>
      <div class="stat-item">
        <span>Số mốc đo:</span> <strong>{{TOTAL_POINTS}}</strong>
      </div>
      <span class="stat-sep">•</span>
      <div class="stat-item">
        <span>Cập nhật:</span> <strong>{{LATEST_TIME}}</strong>
      </div>
    </div>

    <!-- CHART AREA -->
    <div class="chart-area">
      {{CHART_CONTENT}}
    </div>

    <!-- FOOTER -->
    <div class="footer">
      <div class="footer-left">
        <span>Tự động theo dõi mỗi 1 giờ</span>
      </div>
      <div class="footer-right">
        KingMc Stats Bot
      </div>
    </div>
  </div>

</body>
</html>
