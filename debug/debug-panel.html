<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KingMC Bot Debug Panel</title>
  <style>
    :root {
      --bg-dark: #121212;
      --bg-panel: #1e1e1e;
      --text-light: #e0e0e0;
      --accent-color: #bb86fc;
      --success: #03dac6;
      --error: #cf6679;
      --border: #333;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-light);
      display: grid;
      grid-template-columns: 350px 1fr 350px;
      grid-template-rows: auto 1fr;
      height: 100vh;
      overflow: hidden;
    }

    header {
      grid-column: 1 / -1;
      background-color: #272727;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      margin: 0;
      font-size: 1.2rem;
      color: var(--accent-color);
    }

    .status-badge {
      padding: 5px 10px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.9rem;
    }
    .status-online { background-color: var(--success); color: #000; }
    .status-offline { background-color: var(--error); color: #fff; }

    .panel {
      background-color: var(--bg-panel);
      margin: 10px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .panel-header {
      background-color: #2c2c2c;
      padding: 10px;
      font-weight: bold;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
    }

    .panel-content {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      font-size: 0.9rem;
    }

    /* Left Sidebar: Info & Position */
    .sidebar-left {
      display: flex;
      flex-direction: column;
    }

    /* Middle: Chat */
    .main-content {
      display: flex;
      flex-direction: column;
    }

    /* Right Sidebar: GUI & Inventory */
    .sidebar-right {
      display: flex;
      flex-direction: column;
    }

    .chat-msg {
      margin-bottom: 6px;
      line-height: 1.4;
      word-wrap: break-word;
    }
    .chat-time {
      color: #888;
      font-size: 0.8em;
      margin-right: 5px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      border-bottom: 1px solid #333;
      padding-bottom: 4px;
    }
    .info-label { color: #aaa; }
    .info-value { font-family: monospace; color: var(--success); }

    .inventory-grid {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      gap: 2px;
      background-color: #555;
      padding: 2px;
      border: 2px solid #888;
    }
    
    .inv-slot {
      aspect-ratio: 1;
      background-color: #8b8b8b;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: inset 2px 2px 0px #fff, inset -2px -2px 0px #555;
      cursor: help;
    }
    
    .inv-slot:hover { background-color: #a0a0a0; }
    
    .inv-count {
      position: absolute;
      bottom: 2px;
      right: 2px;
      font-size: 0.8rem;
      font-weight: bold;
      color: white;
      text-shadow: 1px 1px 0 #000;
    }

    .tooltip {
      position: absolute;
      background-color: rgba(16, 0, 16, 0.95);
      border: 2px solid #300060;
      color: white;
      padding: 5px;
      border-radius: 4px;
      font-size: 0.85rem;
      z-index: 1000;
      white-space: pre-wrap;
      pointer-events: none;
      display: none;
      max-width: 300px;
    }
    
    .item-name { color: #55FFFF; font-weight: bold; }
    .item-lore { color: #AA00AA; }

    .log-entry { margin-bottom: 10px; border-bottom: 1px dashed #444; padding-bottom: 5px; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-dark); }
    ::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #777; }
  </style>
</head>
<body>
  <header>
    <h1>KingMC Bot - Live Debug</h1>
    <div id="status-badge" class="status-badge status-offline">Đang kết nối...</div>
  </header>

  <div class="sidebar-left">
    <div class="panel">
      <div class="panel-header">Server Info</div>
      <div class="panel-content" id="server-info">
        <!-- Rendered by JS -->
      </div>
    </div>

    <div class="panel" style="flex: 1">
      <div class="panel-header">Tọa độ & Môi trường</div>
      <div class="panel-content" id="position-info">
        <!-- Rendered by JS -->
      </div>
    </div>
  </div>

  <div class="main-content">
    <div class="panel" style="flex: 1; display: flex; flex-direction: column;">
      <div class="panel-header">
        <span>Chat & Logs</span>
        <button onclick="clearChat()" style="background:none; border:1px solid #555; color:white; cursor:pointer;">Clear</button>
      </div>
      <div class="panel-content" id="chat-box" style="flex: 1;">
        <!-- Chat messages go here -->
      </div>
      <div style="padding: 10px; border-top: 1px solid var(--border); display: flex; gap: 5px;">
        <input type="text" id="chat-input" placeholder="Gõ lệnh /... hoặc nội dung chat..." style="flex: 1; padding: 5px; background: #333; color: white; border: 1px solid #555;">
        <button onclick="sendChat()" style="padding: 5px 15px; background: var(--success); border: none; cursor: pointer; color: black; font-weight: bold;">Gửi</button>
      </div>
    </div>
  </div>

  <div class="sidebar-right">
    <div class="panel">
      <div class="panel-header">
        <span>GUI Đang Mở</span>
        <button onclick="closeGui()" style="background:none; border:1px solid var(--error); color:var(--error); cursor:pointer; font-size: 0.8rem;">Đóng GUI</button>
      </div>
      <div class="panel-content" id="gui-info">
        Không có GUI nào đang mở.
      </div>
    </div>

    <div class="panel" style="flex: 1">
      <div class="panel-header">Túi Đồ (Inventory)</div>
      <div class="panel-content">
        <div class="inventory-grid" id="inventory-grid">
          <!-- 36 slots -->
        </div>
      </div>
    </div>
  </div>

  <div id="tooltip" class="tooltip"></div>

  <script>
    const statusBadge = document.getElementById('status-badge');
    const chatBox = document.getElementById('chat-box');
    const serverInfoBox = document.getElementById('server-info');
    const positionBox = document.getElementById('position-info');
    const guiInfoBox = document.getElementById('gui-info');
    const invGrid = document.getElementById('inventory-grid');
    const tooltip = document.getElementById('tooltip');

    // Khởi tạo 36 ô inventory trống
    for(let i=0; i<36; i++) {
      const div = document.createElement('div');
      div.className = 'inv-slot';
      div.id = 'inv-slot-' + i;
      invGrid.appendChild(div);
    }

    function formatTime(isoString) {
      if(!isoString) return '';
      const d = new Date(isoString);
      return d.toLocaleTimeString('vi-VN', {hour12: false});
    }

    function clearChat() {
      chatBox.innerHTML = '';
    }

    function escapeHtml(unsafe) {
      return (unsafe || '').toString()
           .replace(/&/g, "&amp;")
           .replace(/</g, "&lt;")
           .replace(/>/g, "&gt;")
           .replace(/"/g, "&quot;")
           .replace(/'/g, "&#039;");
    }

    // ─── Gửi action lên server ───
    async function sendAction(data) {
      try {
        await fetch('/api/action', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
      } catch (e) {
        console.error('Send action error', e);
      }
    }

    function sendChat() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if(text) {
        sendAction({ type: 'chat', message: text });
        input.value = '';
      }
    }

    document.getElementById('chat-input').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') sendChat();
    });

    function closeGui() {
      sendAction({ type: 'closeGui' });
    }

    function clickGuiSlot(slotId) {
      sendAction({ type: 'clickGui', slot: slotId, mouseButton: 0, mode: 0 });
    }
    // ────────────────────────────

    // Xử lý EventSource (SSE)
    const evtSource = new EventSource('/events');

    evtSource.onopen = () => {
      console.log('Đã kết nối SSE');
    };

    evtSource.onerror = () => {
      statusBadge.textContent = 'Mất kết nối Live Debug';
      statusBadge.className = 'status-badge status-offline';
    };

    evtSource.addEventListener('init', (e) => {
      const state = JSON.parse(e.data);
      console.log('Init state:', state);
      updateStatus(state.status);
      updatePosition(state.position);
      updateServerInfo(state.serverInfo);
      updateGui(state.gui);
      updateInventory({slots: state.inventory});
      
      clearChat();
      if(state.chat) {
        state.chat.forEach(c => appendChat(c));
      }
    });

    evtSource.addEventListener('status', (e) => updateStatus(JSON.parse(e.data)));
    evtSource.addEventListener('chat', (e) => appendChat(JSON.parse(e.data)));
    evtSource.addEventListener('position', (e) => updatePosition(JSON.parse(e.data)));
    evtSource.addEventListener('inventory', (e) => updateInventory(JSON.parse(e.data)));
    evtSource.addEventListener('gui', (e) => updateGui(JSON.parse(e.data)));
    evtSource.addEventListener('serverInfo', (e) => updateServerInfo(JSON.parse(e.data)));

    function updateStatus(status) {
      if(!status) return;
      if (status.connected) {
        statusBadge.textContent = `Online: ${status.username} @ ${status.host}`;
        statusBadge.className = 'status-badge status-online';
      } else {
        statusBadge.textContent = 'Bot Offline / Đang Reconnect';
        statusBadge.className = 'status-badge status-offline';
      }
    }

    function updateServerInfo(info) {
      if(!info) return;
      serverInfoBox.innerHTML = `
        <div class="info-row"><span class="info-label">Action H.Tại:</span><span class="info-value">${info.currentAction || 'None'}</span></div>
        <div class="info-row"><span class="info-label">Ready (Sẵn sàng):</span><span class="info-value" style="color: ${info.isReady ? '#03dac6' : '#cf6679'}">${info.isReady}</span></div>
        <div class="info-row"><span class="info-label">Busy (Đang bận):</span><span class="info-value">${info.isBusy}</span></div>
      `;
    }

    function updatePosition(pos) {
      if(!pos || pos.x === null) {
        positionBox.innerHTML = '<div style="color:#aaa; text-align:center;">Chưa có dữ liệu vị trí</div>';
        return;
      }
      positionBox.innerHTML = `
        <div class="info-row"><span class="info-label">World:</span><span class="info-value">${pos.world || 'N/A'}</span></div>
        <div class="info-row"><span class="info-label">X:</span><span class="info-value">${Number(pos.x).toFixed(2)}</span></div>
        <div class="info-row"><span class="info-label">Y:</span><span class="info-value">${Number(pos.y).toFixed(2)}</span></div>
        <div class="info-row"><span class="info-label">Z:</span><span class="info-value">${Number(pos.z).toFixed(2)}</span></div>
        <div class="info-row"><span class="info-label">Ping:</span><span class="info-value">${pos.ping} ms</span></div>
      `;
    }

    function appendChat(msg) {
      const div = document.createElement('div');
      div.className = 'chat-msg';
      div.innerHTML = `<span class="chat-time">[${formatTime(msg.ts)}]</span> <span style="color: ${msg.isJson ? '#bbb' : '#fff'}">${escapeHtml(msg.text)}</span>`;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function updateGui(gui) {
      if(!gui || !gui.title) {
        guiInfoBox.innerHTML = '<div style="color:#aaa; text-align:center;">Không có GUI</div>';
        return;
      }
      
      let html = `<div class="info-row"><span class="info-label">Title:</span><span class="info-value" style="color:#FFF;">${escapeHtml(gui.title)}</span></div>`;
      html += `<div style="font-size:0.8em; color:#aaa; margin-bottom:5px;">Total Slots: ${gui.slots ? gui.slots.length : 0}</div>`;
      
      if(gui.slots && gui.slots.length > 0) {
        html += `<div style="max-height: 300px; overflow-y:auto; border: 1px solid #333; padding: 5px; background: #111;">`;
        // Hiển thị tối đa 54 slot đầu (GUI)
        const limit = Math.min(gui.slots.length, 54);
        for(let i=0; i<limit; i++) {
          const item = gui.slots[i];
          if(!item) continue;
          const dn = item.displayName || item.name;
          html += `<div style="border-bottom:1px solid #333; margin-bottom:3px; padding-bottom:3px; cursor: pointer;" onclick="clickGuiSlot(${i})">
            <div style="color:#55FFFF; font-size:0.9em;">[Slot ${i}] ${escapeHtml(dn)} x${item.count}</div>
          </div>`;
        }
        html += `</div>`;
      }
      guiInfoBox.innerHTML = html;
    }

    function updateInventory(data) {
      // Clear current inv
      for(let i=0; i<36; i++) {
        const slotDiv = document.getElementById('inv-slot-' + i);
        slotDiv.innerHTML = '';
        slotDiv.onmouseenter = null;
        slotDiv.onmouseleave = null;
      }

      if(!data || !data.slots) return;
      
      // Map inventory Minecraft (thường 36 slots từ 9 đến 44)
      // data.slots là mảng item, ta map tương đối
      let slotIdx = 0;
      for(const item of data.slots) {
        if(!item) continue;
        if(slotIdx >= 36) break;
        
        const slotDiv = document.getElementById('inv-slot-' + slotIdx);
        // Thay bằng render icon thực tế nếu có url, tạm dùng text
        slotDiv.innerHTML = `<div style="font-size:0.7em; text-align:center; color:#ccc; word-break: break-all; padding:1px;">${item.name.replace('minecraft:','')}</div>
                             <div class="inv-count">${item.count > 1 ? item.count : ''}</div>`;
        
        // Tooltip
        slotDiv.onmouseenter = (e) => {
          let ttHtml = `<div class="item-name">${escapeHtml(item.displayName || item.name)}</div>`;
          if(item.lore && item.lore.length > 0) {
            ttHtml += `<div class="item-lore">${item.lore.map(escapeHtml).join('<br>')}</div>`;
          }
          tooltip.innerHTML = ttHtml;
          tooltip.style.display = 'block';
          
          // Tính toán vị trí
          let x = e.pageX + 10;
          let y = e.pageY + 10;
          
          if (x + tooltip.offsetWidth > window.innerWidth) {
            x = window.innerWidth - tooltip.offsetWidth - 10;
          }
          
          tooltip.style.left = x + 'px';
          tooltip.style.top = y + 'px';
        };
        
        slotDiv.onmousemove = (e) => {
          let x = e.pageX + 10;
          let y = e.pageY + 10;
          if (x + tooltip.offsetWidth > window.innerWidth) x = window.innerWidth - tooltip.offsetWidth - 10;
          tooltip.style.left = x + 'px';
          tooltip.style.top = y + 'px';
        }
        
        slotDiv.onmouseleave = () => {
          tooltip.style.display = 'none';
        };

        slotIdx++;
      }
    }
  </script>
</body>
</html>
